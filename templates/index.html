<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance Dashboard</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; letter-spacing: 1px; }
        .container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; align-items: start; max-width: 1400px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; margin-bottom: 20px; }
        .value { font-size: 2.8rem; font-weight: bold; color: #f8fafc; margin-top: 10px; }
        h2 { color: #94a3b8; font-size: 0.95rem; text-transform: uppercase; margin: 0; }
        
        .photos-container { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .photo-card { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .photo-card img { width: 100%; border-radius: 4px; object-fit: cover; height: 180px; background: #334155; }
        .photo-name { font-weight: bold; margin-top: 8px; font-size: 1rem; color: #f8fafc; }
        .photo-event { font-size: 0.8rem; font-weight: bold; margin-top: 4px; }

        .log-item { background: #0f172a; padding: 12px; margin-top: 12px; border-radius: 8px; border-left: 4px solid #38bdf8; text-align: left; }
        .log-item.rejected { border-left-color: #f87171; }
        .log-item.approved { border-left-color: #4ade80; }
    </style>
</head>
<body>
    <h1>AI Security Command Center</h1>
    <div class="container">
        <!-- Left Column -->
        <div>
            <div class="card">
                <h2>Total Logged Events</h2>
                <div class="value" id="total_entries">0</div>
            </div>
            <div class="card">
                <h2>Authorized Entries</h2>
                <div class="value" id="auth_entries" style="color: #4ade80;">0</div>
            </div>
            <div class="card">
                <h2>Total Rejections</h2>
                <div class="value" id="rejections" style="color: #f87171;">0</div>
            </div>
        </div>

        <!-- Center Column: 4 Recent Photos -->
        <div class="photos-container">
            <h2 style="color: white; margin-bottom: 5px; font-size: 1.2rem; text-align: center;">Recent Visitors</h2>
            <div class="photo-grid" id="visitor_photos">
                <!-- Javascript populates the 4 most recent photos -->
            </div>
        </div>

        <!-- Right Column -->
        <div>
            <div class="card">
                <h2>Latest Entry</h2>
                <div class="value" id="latest_name" style="font-size: 1.5rem; margin: 15px 0;">-</div>
                <div style="font-size: 0.8rem; color: #94a3b8;" id="latest_time">-</div>
            </div>
            <div class="card">
                <h2>Recent Activity Log</h2>
                <div id="recent_logs"></div>
            </div>
        </div>
    </div>

    <script>
        async function updateData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                document.getElementById('total_entries').innerText = data.total_entries;
                document.getElementById('auth_entries').innerText = data.auth_entries;
                document.getElementById('rejections').innerText = data.rejections;
                
                document.getElementById('latest_name').innerText = data.latest_entry.name;
                document.getElementById('latest_time').innerText = data.latest_entry.timestamp;
                
                // Build the list for the 4 recent photos
                const photosDiv = document.getElementById('visitor_photos');
                photosDiv.innerHTML = data.recent_logs.slice(0, 4).map(log => {
                    let color = '#38bdf8';
                    if (log.event_type.includes('REJECT') || log.event_type.includes('TIMEOUT')) color = '#f87171';
                    else if (log.event_type.includes('APPROV') || log.event_type === 'ENTRY') color = '#4ade80';
                    
                    return `
                        <div class="photo-card" style="border-bottom: 3px solid ${color};">
                            <!-- onerror hides the broken image icon if a photo wasn't attached to this log -->
                            <img src="/static/${log.id}.jpg" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'#1e293b\\'/></svg>';">
                            <div class="photo-name">${log.name}</div>
                            <div class="photo-event" style="color: ${color};">${log.event_type}</div>
                        </div>
                    `;
                }).join('');
                
                // Build the text logs
                const logsDiv = document.getElementById('recent_logs');
                logsDiv.innerHTML = data.recent_logs.map(log => {
                    let logClass = '';
                    let color = '#38bdf8';
                    if (log.event_type.includes('REJECT') || log.event_type.includes('TIMEOUT')) {
                        logClass = 'rejected'; color = '#f87171';
                    } else if (log.event_type.includes('APPROV') || log.event_type === 'ENTRY') {
                        logClass = 'approved'; color = '#4ade80';
                    }
                    return `
                        <div class="log-item ${logClass}">
                            <strong style="color: white;">${log.name}</strong><br>
                            <span style="color: ${color}; font-size: 0.85rem; font-weight: bold;">${log.event_type}</span><br>
                            <span style="font-size: 0.75rem; color: #64748b;">${log.timestamp}</span>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error("Sync Error:", e); }
        }
        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
